<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="global.css" />
    <!-- Mapbox GL JS CSS -->
    <link
    href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
    rel="stylesheet"
    />
    <script src="map.js" type="module"></script>
    <link rel="stylesheet" href="map.css" />
</head>
<body>
    <header>
        <h1>🚴🏼‍♀️ Bikewatching</h1>
        <label>
            Filter by time:
            <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
            <time id="selected-time"></time>
            <em id="any-time">(any time)</em>
        </label>
    </header>
    <p>An interactive map of Bluebikes traffic across Boston and Cambridge: where riders start and end their trips, and how that changes throughout the day.</p>
    <div id="map">
        <svg></svg>
    </div>
    <div class="legend">
        <span class="legend-title">Legend:</span>
        <div style="--departure-ratio: 1">More departures</div>
        <div style="--departure-ratio: 0.5">Balanced</div>
        <div style="--departure-ratio: 0">More arrivals</div>
    </div>
</body>
</html>
